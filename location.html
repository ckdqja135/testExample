<script>
	document.addEventListener("DOMContentLoaded", function () {
		var lateX = 129.1189764; // 경도
		var lateY = 35.1745672;  // 위도

		var mapContainer = document.getElementById('map'); //지도를 담을 영역의 DOM 레퍼런스
		var mapOption = { //지도를 생성할 때 필요한 기본 옵션
			center: new kakao.maps.LatLng(lateY, lateX), //지도의 중심좌표.
			level: 2 // 지도의 레벨(확대, 축소 정도)
		};

		var map = new kakao.maps.Map(mapContainer, mapOption);  //지도 생성 및 객체 리턴

		var marker = new kakao.maps.Marker({
			map: map,
			position: new kakao.maps.LatLng(lateY, lateX),
			zIndex: 10 // 마커를 최상단에 표시
		});

		var content = `
				<div class="wrap">
					<div class="info">
						<div class="title">㈜공감ID</div>
						<div class="body">
							<div class="img">
								<img src="images/logo.png" width="60" height="60" alt="㈜공감 로고">
							</div>
							<div class="ellipsis">
								부산시 수영구 좌수영로<br>115, 3층
							</div>
						</div>
					</div>
				</div>
			`;

		// CustomOverlay 생성
		var overlay = new kakao.maps.CustomOverlay({
			content: content,
			position: marker.getPosition(),
			yAnchor: 1.3,
			map: map
		});
	});
</script>
