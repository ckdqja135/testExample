  <style>
    img {
      max-width: 90%; /* 이미지가 부모 요소의 80%까지만 확장되도록 */
      max-height: 500px; /* 최대 높이를 제한하여 일정한 크기 유지 */
      height: auto; /* 가로세로 비율 유지 */
      display: block; /* 인라인 요소 문제 방지 */
      margin: 20px auto; /* 가운데 정렬 및 위아래 여백 조정 */
      object-fit: contain; /* 이미지 비율을 유지하면서도 컨테이너에 맞춤 */
      transform: scale(1.5);
    }

    @media (max-width: 768px) {
      img {
        max-width: 100%; /* 모바일에서는 화면 전체를 사용 */
        max-height: 400px; /* 너무 크지 않도록 높이 제한 */
      }
    }

    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%; /* 부모 요소의 크기에 맞게 조정 */
      max-width: 1000px; /* 최대 너비 설정 */
      margin: 0 auto; /* 가운데 정렬 */
    }
    .wrapper {
      position: relative; /* 가상 요소가 부모를 기준으로 정렬되도록 설정 */
      background-image: url("images/90.png"); /* 배경 이미지 설정 */
      background-size: cover; /* 배경을 요소 크기에 맞게 조절 */
      background-position: center; /* 배경을 중앙 정렬 */
      background-repeat: no-repeat; /* 이미지 반복 방지 */
      width: 100%;
      height: 80%;
      overflow: hidden;
      padding-top: 20px; /* 헤더와 콘텐츠 사이 간격 추가 */
    }

    /* 배경 투명도 조절을 위한 오버레이 */
    .wrapper::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.7); /* 흰색 반투명 오버레이 (0.0~1.0 조절) */
      z-index: 0; /* 다른 요소보다 뒤에 위치 */
    }
  </style>
