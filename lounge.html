		.project-title {
			font-size: 24px;

			margin: 40px 0 20px;
			color: #333;
		}
		
		/* 슬라이더 컨테이너 스타일 */
		.slider {
			width: 100%;
			max-width: 1200px;
			height: 760px;
			margin: 0 auto 60px;
			overflow: hidden;
			box-shadow: none;
			border-radius: 0;
			background-color: transparent;
			padding: 0;
			border: none;
			position: relative;
		}
		
		/* 슬라이더 내부 이미지 스타일 */
		.slick-slide {
			float: none; /* 플로팅 제거 */
			display: flex; /* 슬라이드 내부 정렬 */
			justify-content: center;
			align-items: center;
			width: 100%; /* 슬라이드가 100% 너비를 유지 */
			height: 760px; /* 고정된 높이 설정 */
			box-sizing: border-box;
			background-color: transparent;
			padding: 0;
			margin: 0;
		}
		
		.slick-slide img {
			display: block;
			margin: 0; /* 여백 제거 */
			width: 1200px; /* 고정 너비 설정 */
			height: 760px; /* 고정 높이 설정 */
			object-fit: cover; /* 이미지를 영역에 맞게 조정 */
			background-color: transparent;
			image-rendering: -webkit-optimize-contrast;
			filter: brightness(1.05) contrast(1.05);
		}
		
		.slick-list {
			overflow: hidden; /* 영역 밖 콘텐츠 숨기기 */
			position: relative; /* 위치 설정 */
			height: 100%; /* 컨테이너 높이에 맞춤 */
			background-color: transparent;
		}

		.slick-track {
			display: flex; /* 트랙 정렬 */
			transition: transform 0.3s ease-in-out; /* 부드러운 슬라이딩 효과 */
			height: 100%; /* 컨테이너 높이에 맞춤 */
			background-color: transparent;
		}
		
		/* 슬라이더 화살표와 점 스타일 */
		.slick-prev, .slick-next {
			z-index: 10;
			width: 40px;
			height: 40px;
		}
		
		.slick-prev {
			left: 5px;
		}
		
		.slick-next {
			right: 5px;
		}
		
		.slick-dots {
			bottom: 10px;
			z-index: 10;
		}
		
		/* 모바일 대응 */
		@media (max-width: 768px) {
			.project-title {
				font-size: 20px;
				margin: 30px 0 15px;
			}
			
			.slider {
				height: auto;
				margin-bottom: 40px;
				max-width: 100%;
			}
			
			.slick-slide {
				width: 100% !important; /* 슬라이드 너비를 100%로 고정 */
				height: auto; /* 모바일에서 비율에 맞게 조정 */
			}
			
			.slick-slide img {
				width: 100%;
				height: auto;
				aspect-ratio: 1200/760; /* 원본 비율 유지 */
			}
			
			.slick-track {
				display: flex;
				justify-content: center;
			}
			
			.slick-prev, .slick-next {
				width: 30px;
				height: 30px;
			}
		}
		
		/* 컨테이너 배경 투명화 */
		.wrapper .container {
			background-color: transparent;
			width: 100%;
			max-width: 1200px;
			padding: 0;
			margin: 0 auto;
		}
		
		/* 슬릭 관련 요소 모두 투명 배경으로 설정 */
		.slick-list, .slick-track, .slick-slide > div {
			background-color: transparent !important;
			width: 100%;
		}
		
		/* 슬라이더 내부 div 요소 */
		.slick-slide > div {
			width: 100%;
			height: 100%;
			padding: 0;
			margin: 0;
		}
