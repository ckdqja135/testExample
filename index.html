      <title>㈜공감 - 공간을 디자인하는 회사</title>

      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
      <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
      <link rel="stylesheet" href="assets/css/main.css" />
      <link rel="stylesheet" href="assets/css/footer.css" />
      <link rel="stylesheet" href="assets/css/header.css" />
      <link rel="stylesheet" href="assets/css/mobile-fixes.css" />

      <!-- jQuery (필수) -->

      <!-- Slick CSS -->
      <link
            rel="stylesheet"
            type="text/css"
            href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"
      />
      <link
            rel="stylesheet"
            type="text/css"
            href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"
      />

      <!-- Slick JS -->
      <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

      <style>
         .wrapper {
            background-color: rgba(128, 128, 128, 0.3); /* Hotel.html과 동일한 회색, 투명도 0.3 적용 */
            padding: 0;
            padding-top: 20px; /* 헤더와 콘텐츠 사이 간격 추가 */
         }
         @media (max-width: 768px) {
            .slick-slide {
               width: 100% !important; /* 슬라이드 너비를 100%로 고정 */
            }
            .slick-track {
               display: flex;
               justify-content: center;
            }
         }

         .slick-list {
            overflow: hidden; /* 영역 밖 콘텐츠 숨기기 */
            position: relative; /* 위치 설정 */
            height: 100%; /* 컨테이너 높이에 맞춤 */
            background-color: transparent;
         }

         .slick-track {
            display: flex; /* 트랙 정렬 */
            transition: transform 0.3s ease-in-out; /* 부드러운 슬라이딩 효과 */
            height: 100%; /* 컨테이너 높이에 맞춤 */
            background-color: transparent;
         }

         /* 슬라이더 컨테이너 스타일 */
         .slider {
            width: 100%;
            max-width: 1200px;
            height: 760px;
            margin: 0 auto 60px;
            overflow: hidden;
            box-shadow: none;
            border-radius: 0;
            background-color: transparent;
            padding: 0;
            border: none;
            position: relative;
         }

         .slick-slide {
            float: none; /* 플로팅 제거 */
            display: flex; /* 슬라이드 내부 정렬 */
            justify-content: center;
            align-items: center;
            width: 100%; /* 슬라이드가 100% 너비를 유지 */
            height: 760px; /* 고정된 높이 설정 */
            box-sizing: border-box;
            background-color: transparent;
            padding: 0;
            margin: 0;
         }

         .slick-slide img {
            display: block;
            margin: 0; /* 여백 제거 */
            width: 1200px; /* 고정 너비 설정 */
            height: 760px; /* 고정 높이 설정 */
            object-fit: cover; /* 이미지를 영역에 맞게 조정 */
            background-color: transparent;
            image-rendering: -webkit-optimize-contrast;
            filter: brightness(1.05) contrast(1.05);
         }

         /* 슬라이더 화살표와 점 스타일 */
         .slick-prev, .slick-next {
            z-index: 10;
            width: 40px;
            height: 40px;
         }
            
         .slick-prev {
            left: 5px;
         }
            
         .slick-next {
            right: 5px;
         }
            
         .slick-dots {
            bottom: 10px;
            z-index: 10;
         }

         /* 모달 배경 (어두운 오버레이) */
         .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
         }

         /* 모달 창 */
         .modal {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            text-align: center;
         }

         /* 닫기 버튼 (모달 중앙) */
         .close-btn {
            display: block;
            margin: 20px auto 0; /* 중앙 정렬 */
            padding: 10px 20px;
            background: crimson;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
         }

         /* 버튼 스타일 */
         .open-modal-btn {
            margin-top: 50px;
            padding: 10px 20px;
            background: royalblue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
         }

         /* 메인 콘텐츠 스타일 */
         .main-content {
            font-family: 'Noto Sans KR', sans-serif;
            text-align: center;
            font-size: 1.3rem; /* 폰트 크기 키움 */
            font-weight: 500; /* 약간 더 굵게 */
            line-height: 1.5;
            color: #333;
            margin: 30px auto;
            width: 100%;
            max-width: 1200px;
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.9); /* 배경색 더 밝게 */
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1); /* 그림자 약간 강화 */
            display: flex;
            justify-content: center;
            align-items: center;
         }
         
         .main-content span {
            display: inline-block;
            max-width: 100%;
            text-align: center;
         }
         
         /* 화면 크기에 따른 텍스트 조정 */
         @media (max-width: 768px) {
            .main-content {
               font-size: 1.15rem; /* 모바일에서도 글꼴 키움 */
               padding: 12px 15px;
            }
         }
         
         @media (max-width: 480px) {
            .main-content {
               font-size: 1rem; /* 작은 모바일에서도 글꼴 키움 */
               padding: 10px;
            }
         }

         /* 메인 타이틀 스타일 */
         .main-title {
            font-family: 'Noto Sans KR', sans-serif;
            text-align: center;
            font-size: 2.5em;
            font-weight: 700;
            margin: 40px 0 35px;
            color: #333;
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            opacity: 0; /* 처음에는 보이지 않음 */
            animation: smoothFadeIn 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; /* 페이지 로드 직후 시작 */
         }
         
         .main-title span {
            position: relative;
            z-index: 1;
            padding: 0 15px;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            background-image: linear-gradient(to right, #444, #666, #444);
         }
         
         .main-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0; /* 처음에는 선이 없음 */
            height: 3px;
            background: linear-gradient(90deg, rgba(100, 100, 100, 0.1), rgba(70, 70, 70, 0.8), rgba(100, 100, 100, 0.1));
            border-radius: 50px;
            opacity: 0;
            animation: expandWidth 1s cubic-bezier(0.17, 0.84, 0.44, 1) forwards 1.5s; /* 타이틀이 나타난 후에 선이 확장됨 */
         }
         
         .main-title:before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 10px;
            width: 0; /* 처음에는 선이 없음 */
            height: 1px;
            background: rgba(150, 150, 150, 0.2);
            opacity: 0;
            animation: expandWidthBefore 1s cubic-bezier(0.17, 0.84, 0.44, 1) forwards 1.9s; /* 첫 번째 선 이후에 두 번째 선이 확장됨 */
         }
         
         @keyframes smoothFadeIn {
            0% { opacity: 0; transform: translateY(-15px); }
            20% { opacity: 0.2; }
            100% { opacity: 1; transform: translateY(0); }
         }
         
         @keyframes expandWidth {
            0% { width: 0; opacity: 0; }
            100% { width: 120px; opacity: 1; }
         }
         
         /* 메인 타이틀 전 선 애니메이션 */
         @keyframes expandWidthBefore {
            0% { width: 0; opacity: 0; }
            100% { width: 250px; opacity: 1; }
         }
         
         @media (max-width: 768px) {
            .main-title {
               font-size: 2.2em;
               margin: 30px 0 25px;
            }
         }
         
         @media (max-width: 480px) {
            .main-title {
               font-size: 1.8em;
               margin: 25px 0 20px;
            }
         }
      </style>
   </head>

         <!-- Main -->
         <div class="wrapper">

                  <!-- 메인 타이틀 추가 -->

                  <!-- Image Slider -->
                  <div class="slider">

                        <div>

         </div>
         <!-- Footer -->
         <div class="footer-include"></div>
      
      <!-- 모달 -->
      <div class="modal-overlay">
        <div class="modal">
          <h2>문의</h2>
          <p>00:00 ~ 00:00</p>
          <p>051-714-3163</p>
          <button class="close-btn">닫기</button>
        </div>
      </div>
      
   </div>
   <!-- Scripts -->
         <script src="assets/js/jquery.dropotron.min.js"></script>
         <script src="assets/js/browser.min.js"></script>
         <script src="assets/js/breakpoints.min.js"></script>
         <script src="assets/js/util.js"></script>
         <script src="assets/js/main.js"></script>

         <script>
            $(document).ready(function(){
               $('.slider').slick({
                  infinite: false,
                  slidesToShow: 1,
                  slidesToScroll: 1,
                  autoplay: true,
                  centerMode: false,
                  autoplaySpeed: 3500,
                  arrows: true,
                  dots: true,
                  adaptiveHeight: true, // 슬라이더 높이를 이미지에 맞춤

            });
